heat_template_version: 2018-08-31

description: >
  Infrastructure OpenStack : reseau prive, routeur, deux serveurs web Caddy
  (vm1, vm2) derriere un load balancer Octavia avec IP flottante.

parameters:
  image:
    type: string
    default: ubuntu-22.04
  flavor:
    type: string
    default: m1.small
  external_network:
    type: string
    default: public

resources:
  mon_reseau:
    type: OS::Neutron::Net
    properties:
      name: reseau-heat

  mon_sous_reseau:
    type: OS::Neutron::Subnet
    properties:
      name: subnet-heat
      network: { get_resource: mon_reseau }
      cidr: 10.0.2.0/24
      gateway_ip: 10.0.2.1
      dns_nameservers: [8.8.8.8]

  mon_routeur:
    type: OS::Neutron::Router
    properties:
      name: routeur-heat
      external_gateway_info:
        network: { get_param: external_network }

  interface_routeur:
    type: OS::Neutron::RouterInterface
    properties:
      router: { get_resource: mon_routeur }
      subnet: { get_resource: mon_sous_reseau }

  sg_web:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-web-heat
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          direction: ingress
        - protocol: tcp
          port_range_min: 80
          port_range_max: 80
          direction: ingress
        - protocol: icmp
          direction: ingress

  vm1:
    type: OS::Nova::Server
    depends_on: [interface_routeur]
    properties:
      name: vm1
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_resource: mon_reseau }
      security_groups:
        - { get_resource: sg_web }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        export DEBIAN_FRONTEND=noninteractive
        for i in 1 2 3 4 5 6; do apt-get update && break; sleep 10; done
        apt-get install -y curl gpg apt-transport-https
        KEY=/usr/share/keyrings/caddy-stable-archive-keyring.gpg
        URL=https://dl.cloudsmith.io/public/caddy/stable
        curl -1sLf $URL/gpg.key | gpg --dearmor -o $KEY
        curl -1sLf $URL/debian.deb.txt \
          > /etc/apt/sources.list.d/caddy-stable.list
        apt-get update
        apt-get install -y caddy
        IP=$(hostname -I | awk '{print $1}')
        cat > /usr/share/caddy/index.html <<HTML
        <h1>Serveur : VM1</h1>
        <p>Adresse IP privee : $IP</p>
        HTML
        systemctl enable --now caddy
        systemctl restart caddy

  vm2:
    type: OS::Nova::Server
    depends_on: [interface_routeur]
    properties:
      name: vm2
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_resource: mon_reseau }
      security_groups:
        - { get_resource: sg_web }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        export DEBIAN_FRONTEND=noninteractive
        for i in 1 2 3 4 5 6; do apt-get update && break; sleep 10; done
        apt-get install -y curl gpg apt-transport-https
        KEY=/usr/share/keyrings/caddy-stable-archive-keyring.gpg
        URL=https://dl.cloudsmith.io/public/caddy/stable
        curl -1sLf $URL/gpg.key | gpg --dearmor -o $KEY
        curl -1sLf $URL/debian.deb.txt \
          > /etc/apt/sources.list.d/caddy-stable.list
        apt-get update
        apt-get install -y caddy
        IP=$(hostname -I | awk '{print $1}')
        cat > /usr/share/caddy/index.html <<HTML
        <h1>Serveur : VM2</h1>
        <p>Adresse IP privee : $IP</p>
        HTML
        systemctl enable --now caddy
        systemctl restart caddy

  lb:
    type: OS::Octavia::LoadBalancer
    properties:
      name: lb-web
      vip_subnet: { get_resource: mon_sous_reseau }

  listener:
    type: OS::Octavia::Listener
    properties:
      protocol: HTTP
      protocol_port: 80
      loadbalancer: { get_resource: lb }

  pool:
    type: OS::Octavia::Pool
    properties:
      protocol: HTTP
      lb_algorithm: ROUND_ROBIN
      listener: { get_resource: listener }

  member1:
    type: OS::Octavia::PoolMember
    properties:
      pool: { get_resource: pool }
      address: { get_attr: [vm1, first_address] }
      protocol_port: 80
      subnet: { get_resource: mon_sous_reseau }

  member2:
    type: OS::Octavia::PoolMember
    depends_on: [member1]
    properties:
      pool: { get_resource: pool }
      address: { get_attr: [vm2, first_address] }
      protocol_port: 80
      subnet: { get_resource: mon_sous_reseau }

  monitor:
    type: OS::Octavia::HealthMonitor
    depends_on: [member2]
    properties:
      pool: { get_resource: pool }
      type: HTTP
      delay: 5
      timeout: 3
      max_retries: 3

  lb_fip:
    type: OS::Neutron::FloatingIP
    depends_on: [interface_routeur]
    properties:
      floating_network: { get_param: external_network }
      port_id: { get_attr: [lb, vip_port_id] }

outputs:
  instance_ip:
    description: IP privee de vm1
    value: { get_attr: [vm1, first_address] }
  instance_id:
    description: ID de vm1
    value: { get_resource: vm1 }
  lb_floating_ip:
    description: IP flottante du load balancer
    value: { get_attr: [lb_fip, floating_ip_address] }
